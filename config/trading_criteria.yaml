# ──────────────────────────────────────────────────────────────
# Trading criteria — used by RiskManager to validate EVERY trade
# and by the Analytics/Learning engines to evaluate completed trades.
# ──────────────────────────────────────────────────────────────

# Minimum TP / SL ratios enforced at the signal level.
min_tp_pips: 10
min_sl_pips: 10
# Guard against nonsensical setups: SL must be > 1.2x the ATR(14) on M5 for XAUUSD.
min_risk_reward_ratio: 1.5

# Success criteria for a completed trade.
success:
  # A trade counts as "won" when it exits at TP or better.
  win_on_tp: true
  # Breakeven (0 to +0.1R) after hitting breakeven level counts as a small win.
  count_breakeven_as_win: true
  # A trade is only "valid" for stats when it was NOT cancelled (no fill, rejected, etc.)
  exclude_unfilled: true
  # Maximum spread (points) above which new entries are blocked.
  max_spread_points: 30
  max_slippage_points: 20

# Performance evaluation metrics the system must track and report.
evaluation_metrics:
  - win_rate
  - profit_factor
  - expectancy_r          # mean R multiple per trade
  - average_win_r
  - average_loss_r
  - max_drawdown_percent
  - max_drawdown_duration_days
  - sharpe_ratio
  - sortino_ratio
  - total_trades
  - consecutive_losses
  - average_holding_minutes
  - equity_curve_smoothness

# Criteria thresholds for promoting a strategy version to the next stage.
promotion_gates:
  paper:
    min_trades: 50
    min_win_rate: 0.45
    min_profit_factor: 1.2
    max_drawdown_percent: 10
  live:
    min_trades: 100
    min_win_rate: 0.45
    min_profit_factor: 1.3
    max_drawdown_percent: 8
